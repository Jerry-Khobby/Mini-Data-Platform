name: CI - Sales ETL Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mini_user
          POSTGRES_PASSWORD: mini_pass
          POSTGRES_DB: mini_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mini_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------
      # Linting
      # ----------------------------
      - name: Run flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # ----------------------------
      # Formatting Check
      # ----------------------------
      - name: Check formatting with black
        run: |
          pip install black
          black  .

      # ----------------------------
      # Run Unit Tests
      # ----------------------------
      - name: Run pytest
        env:
          POSTGRES_USER: mini_user
          POSTGRES_PASSWORD: mini_pass
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: mini_data
        run: |
          pip install pytest pytest-cov psycopg2-binary
          pytest tests/ -v --cov=scripts --cov-report=term-missing

      # ----------------------------
      # Validate Airflow DAG Import
      # ----------------------------
      - name: Validate DAG imports
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "import orchestration.dags.sales_pipeline"